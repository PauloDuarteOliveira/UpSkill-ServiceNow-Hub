<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpSkill ServiceNow Hub - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER GLOBAL -->
    <header class="header-global">
        <!-- HEADER LADO ESQUERDO -->
        <div class="header-esquerda">
            <div class="logo-area">
                <img src="assets/Logo-Hub.png" alt="Logo UpSkill ServiceNow Hub">
                <span class="badge-trainee">IT CONSULTANT TRAINEE TRACK</span>

            </div>
        </div>
        <!-- HEADER LADO DIREITO -->
        <div class="header-direita">
            <div>
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Pesquisar módulos, lições, documentação...">
            </div>
            <button class="icon-notificacao">🔔</button>
            <button class="icon-dark-light-mode">🌙</button>

            <!-- Avatar com Dropdown ativado por CSS -->
            <div class="perfil-dropdown" tabindex="0">
                <img src="assets/foto.png" alt="Foto de Perfil" class="avatar-header">
                <ul>
                    <li><a href="#">👤 O Meu Perfil</a></li>
                    <li><a href="#">⚙️ Defenições</a></li>
                    <li class="separador"></li>
                    <li><a href="#">🚪 Terminar sessão</a></li>
                </ul>
            </div>
        </div>

    </header>
</body>

</html>
